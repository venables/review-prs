name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is the primary target; Linux catches anything that quietly
        # depended on it. The test harness is bash 3.2 compatible because that
        # is what macOS ships.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Rust is preinstalled on both runner images; the cache keeps the cargo
      # build from dominating the run.
      - uses: Swatinem/rust-cache@v2

      - name: Install shellcheck and jq
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install shellcheck jq
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck jq
          fi

      - name: Run tests
        run: bash tests/run.sh
