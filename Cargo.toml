[package]
name = "autoreview"
version = "0.9.0"
edition = "2024"
description = "Review a repo's open PRs headlessly, with progress and a real exit status"
license = "MIT"

[dependencies]
anyhow = "1"
comfy-table = { version = "8.0.0", features = ["custom_styling"] }
console = "0.16.4"
indicatif = "0.18.6"
md-5 = "0.10"
nix = { version = "0.30", features = ["signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

[profile.release]
strip = true
