[package]
name = "autoreview"
version = "0.14.0"
edition = "2024"
description = "Automated code review: watch a repo's PRs and review each with a panel of models"
license = "MIT"

# Three front-ends over one library. The two that read PRs must agree on which
# ones are worth reviewing and on which session each belongs to, and sharing a
# build is what guarantees it.
[lib]
name = "autoreview"
path = "src/lib.rs"

[[bin]]
name = "autoreview"
path = "src/bin/autoreview.rs"

[[bin]]
name = "review-prs"
path = "src/bin/review-prs.rs"

[[bin]]
name = "panel"
path = "src/bin/panel.rs"

[dependencies]
anyhow = "1"
comfy-table = { version = "8.0.0", features = ["custom_styling"] }
console = "0.16.4"
crossterm = "0.29"
indicatif = "0.18.6"
md-5 = "0.10"
nix = { version = "0.30", features = ["signal"] }
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

[profile.release]
strip = true
