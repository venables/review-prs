[package]
name = "autoreview"
version = "0.8.0"
edition = "2024"
description = "Review a repo's open PRs headlessly, with progress and a real exit status"
license = "MIT"

[dependencies]
anyhow = "1"
md-5 = "0.10"
nix = { version = "0.30", features = ["signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

[profile.release]
strip = true
