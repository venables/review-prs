[package]
name = "autoreview"
version = "0.10.0"
edition = "2024"
description = "Review a repo's open PRs, headlessly or fanned out into terminal tabs"
license = "MIT"

# Two front-ends over one library: they must agree on the PR list and on which
# session a PR belongs to, and sharing a build is what guarantees it.
[lib]
name = "autoreview"
path = "src/lib.rs"

[[bin]]
name = "autoreview"
path = "src/bin/autoreview.rs"

[[bin]]
name = "review-prs"
path = "src/bin/review-prs.rs"

[dependencies]
anyhow = "1"
comfy-table = { version = "8.0.0", features = ["custom_styling"] }
console = "0.16.4"
indicatif = "0.18.6"
md-5 = "0.10"
nix = { version = "0.30", features = ["signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

[profile.release]
strip = true
